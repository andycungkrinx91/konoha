version: 2
# Socket.dev Configuration for Konoha
# Docs: https://docs.socket.dev

projectIgnorePaths:
  - "apps/web"
  - "apps/web/build"
  - "pnpm-lock.yaml"
  - "tests"
  - "tests/**"
  - "docs"
  - "docs/**"
  - "assets/**"
  - "patches/**"
  - ".konoha"
  - ".gemini"
  - ".agents"
  - ".claude"
  - ".cursor"
  - ".commandcode"
  - ".pi"
  - ".omp"

issueRules:
  envVars: false
  urlStrings: false
  networkAccess: false
  gptSecurity: false
  gptAnomaly: false
  usesEval: false
  newAuthor: false
