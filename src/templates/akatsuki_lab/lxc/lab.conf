# ==============================================================================
# src/templates/akatsuki_lab/lxc/lab.conf
#
# Akatsuki Red-Team Lab Topology Configuration (LXC Mode)
# ==============================================================================

LAB_NAME="${LAB_NAME:-akatsuki-lab}"
LAB_BRIDGE="${LAB_BRIDGE:-labbr0}"
LAB_SUBNET="${LAB_SUBNET:-10.77.77.0/24}"
LAB_GATEWAY="${LAB_GATEWAY:-10.77.77.1}"
LAB_ACL="${LAB_ACL:-lab-egress}"

ATTACKER_IMAGE="${ATTACKER_IMAGE:-images:debian/12}"
ATTACKER_MEMORY="${ATTACKER_MEMORY:-2GiB}"
ATTACKER_CPUS="${ATTACKER_CPUS:-2}"

# Security invariants:
# 1. ipv4.nat=false (no host NAT translation)
# 2. egress ACL default reject (strict sandbox confinement)
# 3. Direct host execution strictly denied
