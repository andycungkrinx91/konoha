<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Application Error — Konoha</title>
    <style>
      :root {
        --color-bg: #090d16;
        --color-card: rgba(15, 22, 36, 0.95);
        --color-text: #f8fafc;
        --color-muted: #94a3b8;
        --color-border: rgba(56, 189, 248, 0.25);
        --grad-1: #38bdf8;
        --grad-2: #818cf8;
        --grad-3: #c084fc;
        --grad-4: #f472b6;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --color-bg: #f8fafc;
          --color-card: rgba(255, 255, 255, 0.96);
          --color-text: #0f172a;
          --color-muted: #64748b;
          --color-border: rgba(56, 189, 248, 0.35);
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        background-color: var(--color-bg);
        color: var(--color-text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 32rem;
        width: 100%;
        background-color: var(--color-card);
        border: 1px solid var(--color-border);
        border-radius: 5px;
        box-shadow: 0 20px 48px -8px rgba(0, 0, 0, 0.5);
        overflow: hidden;
        text-align: center;
        padding: 2.5rem 2rem;
        position: relative;
      }
      .accent-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 5px;
        background: linear-gradient(90deg, var(--grad-1), var(--grad-2), var(--grad-3), var(--grad-4));
      }
      .icon-container {
        margin: 1.5rem auto 1.25rem;
        width: 4rem;
        height: 4rem;
        border-radius: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: rgba(239, 68, 68, 0.12);
        border: 1px solid rgba(239, 68, 68, 0.35);
        color: #ef4444;
      }
      .badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-family: ui-monospace, monospace;
        font-weight: 700;
        background-color: rgba(56, 189, 248, 0.12);
        border: 1px solid rgba(56, 189, 248, 0.35);
        color: var(--grad-1);
        margin-bottom: 0.75rem;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.025em;
        margin-bottom: 0.5rem;
      }
      p {
        font-size: 0.875rem;
        color: var(--color-muted);
        line-height: 1.5;
        margin-bottom: 2rem;
      }
      .actions {
        display: flex;
        gap: 0.75rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        padding: 0.625rem 1.25rem;
        border-radius: 5px;
        font-size: 0.875rem;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        border: 1px solid transparent;
        transition: opacity 0.15s ease;
      }
      .btn:hover {
        opacity: 0.9;
      }
      .btn-primary {
        background: linear-gradient(135deg, var(--grad-1), var(--grad-2));
        color: #ffffff;
      }
      .btn-secondary {
        background: transparent;
        border-color: var(--color-border);
        color: var(--color-text);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="accent-bar"></div>
      <div class="icon-container">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </div>
      <div class="badge">KONOHA GATEWAY FALLBACK</div>
      <h1>System Temporarily Unavailable</h1>
      <p>The Konoha web interface encountered a critical runtime condition or is unable to connect with the local gateway daemon.</p>
      <div class="actions">
        <a href="/" class="btn btn-primary">Return to Village</a>
        <button type="button" onclick="window.location.reload()" class="btn btn-secondary">Reload Application</button>
      </div>
    </div>
  </body>
</html>
