name: Konoha test shard
description: >
  Shared setup and sharded suite run for one OS shard. Extracted so the
  test-ubuntu / test-macos / test-windows jobs differ only in runner, shard
  count and `needs`, instead of duplicating ~180 lines of setup three times.
  The caller must check out the repository first: a local action cannot check
  out the tree it is loaded from.

inputs:
  shard:
    description: 'Shard index, 1-based (numerator of KONOHA_TEST_SHARD)'
    required: true
  shard_total:
    description: 'Shard count (denominator of KONOHA_TEST_SHARD)'
    required: true
  node_version_file:
    description: 'File the runtime version is read from, so no workflow repeats the version literal'
    required: false
    default: '.nvmrc'
  source_date_epoch:
    description: 'Reproducible-build timestamp for the web build, passed down from the workflow env block'
    required: true

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6.1.1
      with:
        run_install: false

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version-file: ${{ inputs.node_version_file }}
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # Fresh checkouts ignore apps/web/build (apps/web/.gitignore:3) but
    # tests/test_manifest_invariants.js:72 requires apps/web/build/index.js.
    # Built before the seed on purpose: `konoha init` builds the UI on demand
    # when no build of the current version exists, and resolveWebBuildSource()
    # prefers apps/web/build when there is one. Without this step first the seed
    # build runs a second full SvelteKit build instead of copying this one.
    - name: Restore Hugging Face model cache
      uses: actions/cache@v4
      with:
        path: |
          node_modules/@huggingface/transformers/.cache
          ~/.cache/huggingface
          ~/.konoha/models
        key: konoha-hf-models-${{ runner.os }}-${{ hashFiles('package.json','pnpm-lock.yaml','src/vector_pipeline.js') }}
        restore-keys: |
          konoha-hf-models-${{ runner.os }}-

    - name: Build web
      shell: bash
      env:
        SOURCE_DATE_EPOCH: ${{ inputs.source_date_epoch }}
      run: pnpm --filter konoha-web build

    # The golden seed is a full `konoha init` HOME (~400 MB) that every suite
    # is copied from. It is content-addressed by the same tree hash the
    # harness validates (tests/run_all.js sourceFingerprint over src, bin and
    # scripts), so a hit is provably the seed this commit needs and a miss
    # rebuilds it. Building it costs ~4 minutes on every OS and used to land
    # inside whichever suite started first, blocking all workers.
    - name: Restore golden seed
      id: seed-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/konoha_golden_seed
        key: konoha-seed-${{ runner.os }}-${{ hashFiles('package.json','pnpm-lock.yaml','src/**','bin/**','scripts/**','assets/**') }}

    - name: Build golden seed
      if: steps.seed-cache.outputs.cache-hit != 'true'
      shell: bash
      timeout-minutes: 30
      env:
        KONOHA_SEED_DIR: ${{ runner.temp }}/konoha_golden_seed
      run: node tests/run_all.js --seed-only

    # Saved explicitly rather than through the action's post-step: the post
    # step skips on a red job, and a suite failure would otherwise re-pay the
    # seed build on every subsequent run. continue-on-error because the key is
    # content-addressed: several shards can miss together and build the same
    # seed, and the losers' saves are refused as already-present. That is a
    # cache optimisation failing, not a check failing.
    - name: Save golden seed
      if: steps.seed-cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/konoha_golden_seed
        key: konoha-seed-${{ runner.os }}-${{ hashFiles('package.json','pnpm-lock.yaml','src/**','bin/**','scripts/**','assets/**') }}

    # Bare runners have no browser cache. The harness forwards
    # PLAYWRIGHT_BROWSERS_PATH (tests/run_all.js), defaulting to
    # ~/.cache/ms-playwright — so install to the shared runner.temp path
    # and export the same path for the test step. The cache keeps the
    # ~120 MB chromium download off every run; the install step still runs
    # because Linux also needs the apt-side system libraries.
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install Playwright browsers (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
      run: pnpm exec playwright install --with-deps chromium

    - name: Install Playwright browsers (Windows/macOS)
      if: runner.os != 'Linux'
      shell: bash
      env:
        PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
      run: pnpm exec playwright install chromium

    # tests/test_document_animation_webp.js asserts the animated WebP export,
    # which needs an ffmpeg build with the `libwebp_anim` encoder. The macOS
    # image ships no ffmpeg at all and the Windows image's build may lack the
    # encoder; the module falls back to a static PNG without it, so provision
    # one explicitly and keep the runner's ffmpeg when it already qualifies.
    - name: Ensure ffmpeg with libwebp (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if ! ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libwebp_anim; then
          sudo apt-get update
          sudo apt-get install -y ffmpeg
        fi

    # homebrew-core `ffmpeg` is built without --enable-libwebp, so installing
    # it yields a binary with no `libwebp_anim` encoder. `ffmpeg-full` is the
    # variant that enables libwebp, and it is keg_only (:versioned_formula), so
    # its bin dir has to be appended to PATH explicitly.
    - name: Ensure ffmpeg with libwebp (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        if ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libwebp_anim; then
          exit 0
        fi
        brew install ffmpeg-full
        echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"

    # The Windows image's ffmpeg may lack the encoder, and
    # community.chocolatey.org answers 504 under load — which cost shard 16/16
    # of run 43868450771 a whole job before a single test ran. `choco install`
    # also exits 0 when the feed times out ("Unable to find package"), so the
    # exit code proves nothing and the encoder probe is the only real signal.
    # Retry here and fail this step, rather than leaving the verify step to
    # discover it after the install already reported success.
    - name: Ensure ffmpeg with libwebp (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        function Test-LibwebpAnim {
          # Prepend the shim dir so the freshly installed ffmpeg wins over
          # whichever binary the runner shipped with, without dropping the
          # entries earlier steps appended via $GITHUB_PATH.
          $env:Path = "C:\ProgramData\chocolatey\bin;$env:Path"
          try { $encoders = (& ffmpeg -hide_banner -encoders 2>$null) -join "`n" } catch { return $false }
          return $encoders -match 'libwebp_anim'
        }
        if (Test-LibwebpAnim) { Write-Host 'runner ffmpeg already exposes libwebp_anim'; exit 0 }
        for ($attempt = 1; $attempt -le 3; $attempt++) {
          Write-Host "choco install ffmpeg (attempt $attempt/3)"
          # --force: a choco package that already reports installed would
          # otherwise no-op, and the probe would keep failing on the same
          # binary for all three attempts.
          choco install ffmpeg -y --no-progress --force
          if (Test-LibwebpAnim) { exit 0 }
          Start-Sleep -Seconds (15 * $attempt)
        }
        Write-Host '::error::could not provision an ffmpeg exposing libwebp_anim in 3 attempts'
        exit 1

    # One probe for all three OSes, so a failure must say which binary it
    # rejected: the three provisioning legs differ and the runner's ffmpeg is
    # a plausible suspect every time.
    - name: Verify ffmpeg webp encoder
      shell: bash
      run: |
        node -e 'const{spawnSync}=require("child_process");const enc=spawnSync("ffmpeg",["-hide_banner","-encoders"],{encoding:"utf8"});if(enc.stdout&&enc.stdout.includes("libwebp_anim")){console.log("ffmpeg exposes libwebp_anim");process.exit(0);}const ver=spawnSync("ffmpeg",["-hide_banner","-version"],{encoding:"utf8"});const which=(ver.stdout||"").split("\n")[0]||(ver.error?"ffmpeg not on PATH ("+ver.error.code+")":"ffmpeg not on PATH");console.error("ffmpeg build lacks the libwebp_anim encoder");console.error("resolved:",which);process.exit(1);'

    # test_code_intel_search.js asserts the semantic tier reports `available`,
    # which needs the Granite and MiniLM artifacts on disk. Warming them here
    # keeps an HF download hiccup from surfacing as an unrelated failing
    # suite, and names the network when that is what broke.
    - name: Prefetch semantic models
      shell: bash
      timeout-minutes: 20
      # Every shard runs this, so a Hub outage must not redden the whole matrix:
      # the one shard that owns test_code_intel_search.js fails with the reason.
      continue-on-error: true
      run: node scripts/prefetch_semantic_models.js

    # tests/test_qa_headed_smoke.js fails closed in CI without a display; the
    # test starts its own Xvfb on Linux when the binary is present.
    - name: Install Xvfb (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y xvfb

    # Full suite via tests/run_all.js, split into the shard this job owns.
    # Parallel mode is the harness's own feature (KONOHA_TEST_PARALLEL=1,
    # concurrency 4, with a sequential pool for suites that must run alone).
    # KONOHA_TEST_SHARD is I/N; the harness refuses an empty shard rather than
    # reporting it green.
    # No continue-on-error: a failing suite must turn the workflow red.
    - name: Test (shard)
      shell: bash
      env:
        KONOHA_TEST_PARALLEL: '1'
        KONOHA_TEST_SHARD: ${{ inputs.shard }}/${{ inputs.shard_total }}
        KONOHA_TEST_TIMEOUT: '3600000'
        KONOHA_SHARD_TIMEOUT: '3600000'
        KONOHA_SEED_DIR: ${{ runner.temp }}/konoha_golden_seed
        PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ms-playwright
      timeout-minutes: 60
      run: pnpm test
