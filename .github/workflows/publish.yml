name: Publish Package to npm

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: NPM_TOKEN
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web UI bundle
        run: pnpm run build:web

      - name: Publish to npm registry via OIDC Trusted Publisher
        run: |
          npm publish --provenance --access public --verbose 2>&1 | tee /tmp/npm_publish.log || {
            ERR=$(grep -E "npm error|403|404|401|E40|OIDC|Token" /tmp/npm_publish.log | head -n 20 | tr '\n' ' ')
            echo "::error::OIDC Publish failed: $ERR"
            echo "Attempting fallback publish..."
            npm publish --access public --verbose 2>&1 | tee /tmp/npm_fallback.log || {
              ERR2=$(grep -E "npm error|403|404|401|E40" /tmp/npm_fallback.log | head -n 20 | tr '\n' ' ')
              echo "::error::Fallback Publish failed: $ERR2"
              exit 1
            }
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
