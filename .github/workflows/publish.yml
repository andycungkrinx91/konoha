name: Publish Package to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: NPM_TOKEN
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate

      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web UI bundle
        run: pnpm run build:web

      - name: Socket Supply Chain Security Audit Gate
        run: |
          if [ -n "$SOCKET_SECURITY_API_KEY" ]; then
            npx --yes @socketsecurity/cli ci
          else
            echo "::notice::SOCKET_SECURITY_API_KEY secret not found in repo; relying on pre-commit Kage local audit and Socket GitHub App."
          fi
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}

      - name: Publish to npm registry via OIDC Trusted Publisher
        run: |
          set -o pipefail
          npm publish --provenance --access public --verbose 2>&1 | tee /tmp/npm_publish.log || {
            ERR=$(grep -E "npm error|403|404|401|E40|OIDC|Token|Forbidden|previously" /tmp/npm_publish.log | head -n 20 | tr '\n' ' ')
            echo "::error::OIDC Publish failed: $ERR"
            echo "Attempting fallback publish..."
            npm publish --access public --verbose 2>&1 | tee /tmp/npm_fallback.log || {
              ERR2=$(grep -E "npm error|403|404|401|E40|Forbidden|previously" /tmp/npm_fallback.log | head -n 20 | tr '\n' ' ')
              echo "::error::Fallback Publish failed: $ERR2"
              exit 1
            }
          }
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
