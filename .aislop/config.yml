version: 1
ci:
  failBelow: 100
rules:
  ai-slop/*: error
imports:
  provided:
    - vscode
# Complexity calibration for the Konoha single-runtime architecture:
  # - bin/cli.js is the documented self-contained CLI (all commands in one file
  #   for cross-platform shim simplicity).
  # - Manager/handler functions are deliberately long, self-contained TUI/CLI
  #   dispatchers. Thresholds are set at the measured max of this codebase (JSON-RPC
quality:
  maxFunctionLoc: 100
  maxFileLoc: 700
  maxNesting: 3
  maxParams: 2
# Vendored third-party reference assets (upstream skill mirrors, e.g. anthropic-
  # cybersecurity-skills) are documentation, not executed code — excluded.
exclude:
  - ".cursor/**"
  - ".gemini/**"
  - ".agents/**"
  - ".commandcode/**"
  - ".claude/**"
  - "src/templates/**"
  - "apps/web/build/**"
  - "node_modules/**"
